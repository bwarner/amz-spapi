# Web deploys, promoted by commit rather than by branch.
#
# `main` is the only integration branch. Merging deploys to staging; publishing
# a GitHub Release deploys that commit to production. Merging code does not put
# it in front of customers, which is the whole point of the split.
#
# THE SHAPE, AND WHY IT IS NOT BRANCH-DRIVEN
# ------------------------------------------
# Vercel's Production environment here has **no branch configuration**, so no
# push deploys to production — it happens only from this workflow, on a release.
# `staging` is a Vercel CUSTOM ENVIRONMENT with its own variables and its own
# domain, also with no branch tracking, so it too is deployed explicitly.
#
# What is deliberately left alone is Preview, which still tracks all unassigned
# branches. PR previews keep working automatically and cost nothing to maintain.
# (An earlier draft of this file disabled git deployments wholesale, which would
# have taken PR previews with it.)
#
# The custom environment is what makes staging a real environment rather than a
# borrowed one: its variables are its own, so it needs no branch scoping — and
# branch-scoped Preview variables cannot target `main` anyway while any project
# treats `main` as its production branch.
#
# WHY TWO BUILDS AND NOT `vercel promote`
# ---------------------------------------
# `vercel promote` repoints production at an already-built deployment with no
# rebuild — the ideal "build once, promote the same artifact". It is WRONG here.
# Next.js inlines every `NEXT_PUBLIC_*` value into the client bundle at build
# time, and ours differ per environment, most sharply
# `NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY`: `pk_test_…` for staging, `pk_live_…` for
# production. Promoting a staging build would serve customers a bundle holding
# the Stripe TEST key and staging URLs, and it would report success.
#
# So the COMMIT is promoted, not the artifact: production builds fresh from the
# release tag with production variables. Weaker than byte identity, and the
# strongest guarantee available while public values are baked in at build time.
#
# (The CDK side does get true artifact identity — ADR-0006 content-addresses
# Lambda bundles. Nothing there is inlined at build time. The same phrase means
# different things on the two halves of this system.)
name: Deploy web

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  # Never two deploys to one target at once. Not cancel-in-progress: a half-
  # finished deploy that is cancelled leaves the alias wherever it got to.
  group: deploy-web-${{ github.event_name }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  # Pinned, and in one place. A bare `npx vercel` resolves to whatever is
  # latest at run time, so an unrelated CLI release can change how a PRODUCTION
  # deploy behaves between two runs of the same commit — the one thing a
  # release gate exists to prevent. Bump this line deliberately.
  #
  # `npx --yes` because without it npx can stop to ask before installing a
  # package that is not present, and a prompt in CI is a hung job rather than
  # an error.
  VERCEL_CLI: vercel@59.1.3

jobs:
  staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Gives the run an audit trail and somewhere to hang protection rules.
    environment: staging
    # `id-token: write` mints the OIDC token the AWS role trusts. Naming any
    # permission resets the rest to none, so `contents: read` must come back or
    # the checkout loses its own access.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # AWS before Vercel, for the same reason as production below: the web app
      # is the half that calls the other, so deploying it first can put code in
      # front of a state machine or a route that does not exist yet.
      #
      # Running here and not only at release time is what makes the release
      # boring. These stacks deploy on every push to main, so a broken template,
      # a missing artefact or a permissions gap fails on the merge that caused
      # it — rather than for the first time during a production release, which
      # is the worst moment to discover a stack has never actually deployed.
      - uses: ./.github/actions/deploy-infra
        with:
          stage: staging
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The custom environment's own variables — staging's Auth0 tenant, its
      # Couchbase scope, and the Stripe TEST key. `staging.sellavant.com` is
      # attached to this environment in Vercel, so no aliasing step is needed.
      - run: npx --yes $VERCEL_CLI pull --yes --environment=staging --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes $VERCEL_CLI build --target=staging --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes $VERCEL_CLI deploy --prebuilt --target=staging --token=${{ secrets.VERCEL_TOKEN }}

  production:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: production
    # `id-token: write` is what lets the runner mint the OIDC token AWS trusts.
    # Naming any permission resets every other one to none, so `contents: read`
    # has to be restated or the checkout loses its own access.
    permissions:
      id-token: write
      contents: read
    steps:
      # The tag, not the branch head. A release cut from an older commit must
      # deploy THAT commit — otherwise the release notes describe one thing and
      # production runs another.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # AWS BEFORE VERCEL, AND WHY THE ORDER IS NOT A PREFERENCE
      # -------------------------------------------------------
      # The web app is the half that calls the other. Shipping it first puts
      # code in front of customers that can reference a queue, a state machine
      # or a route that does not exist yet, and the failure surfaces as customer
      # error rather than as a red build. Deploying AWS first inverts that: if
      # infrastructure cannot deploy, the job fails here and production keeps
      # serving the previous release, untouched.
      #
      # This is also the step whose absence let prod drift twenty-two resources
      # behind `main` while the web half shipped twenty-one pull requests.
      #
      # The steps live in a composite action so that giving another stage the
      # same treatment does not mean copying them.
      - uses: ./.github/actions/deploy-infra
        with:
          stage: prod
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: npx --yes $VERCEL_CLI pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes $VERCEL_CLI build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes $VERCEL_CLI deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Recorded because `vercel rollback` is the fix for a bad production
      # deploy and it needs the previous deployment's identity. Finding that
      # after the fact, under pressure, is worse than printing it now.
      - run: |
          echo "Deployed ${{ github.event.release.tag_name }} (${{ github.sha }})"
          echo "Roll back with: vercel rollback"
